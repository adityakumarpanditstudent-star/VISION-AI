name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: |
        sed -i 's/\r$//' AndroidProject/gradlew
        chmod +x AndroidProject/gradlew

    - name: Build with Gradle
      run: cd AndroidProject && ./gradlew assembleDebug > build_log.txt 2>&1 || (cat build_log.txt && exit 1)

    - name: Upload Build Log
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: Gradle-Build-Log
        path: AndroidProject/build_log.txt

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: VisionAI-App
        path: AndroidProject/app/build/outputs/apk/debug/app-debug.apk
