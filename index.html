    <script>
      // Safeguard for browser/iframe environments where window.fetch has only a getter
      (function() {
        try {
          var originalFetch = window.fetch;
          var activeFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch;
            },
            set: function(newFetch) {
              activeFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          // If window.fetch cannot be redefined directly, try prototype
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto) {
              var protoFetch = proto.fetch;
              var activeProtoFetch = protoFetch;
              Object.defineProperty(proto, 'fetch', {
                get: function() {
                  return activeProtoFetch;
                },
                set: function(newFetch) {
                  activeProtoFetch = newFetch;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (err2) {}
        }
      })();
    </script>
